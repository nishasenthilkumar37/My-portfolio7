<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="draw-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58111A" />
      <stop offset="50%" stop-color="#6B172E" />
      <stop offset="100%" stop-color="#D48B97" />
    </linearGradient>
    <filter id="draw-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#draw-bg)"/>

  <g transform="translate(50, 35)" filter="url(#draw-shadow)">
    <!-- Browser App Frame -->
    <rect width="700" height="430" rx="12" fill="#1A0A10" stroke="rgba(212, 139, 151, 0.25)" stroke-width="1.5"/>
    
    <!-- Top Window Bar -->
    <circle cx="25" cy="22" r="5" fill="#E8A5B2"/>
    <circle cx="42" cy="22" r="5" fill="#D48B97"/>
    <circle cx="59" cy="22" r="5" fill="#FAF6F0"/>
    <rect x="220" y="12" width="260" height="20" rx="10" fill="#2D111C"/>
    <text x="350" y="26" fill="#D48B97" font-size="10" font-family="'Plus Jakarta Sans', sans-serif" text-anchor="middle">howtodraw.creative/tutorials</text>

    <!-- App Header & Navigation Inside Mockup -->
    <g transform="translate(25, 48)">
      <text x="0" y="24" fill="#FAF6F0" font-size="16" font-family="'Outfit', sans-serif" font-weight="800">🎨 DrawCraft</text>
      <text x="110" y="24" fill="#D48B97" font-size="11" font-family="sans-serif">Step-by-Step Interactive Guides</text>
      
      <!-- Category Badges -->
      <g transform="translate(380, 5)">
        <rect x="0" y="0" width="70" height="24" rx="12" fill="#6B172E"/>
        <text x="35" y="16" fill="#FAF6F0" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Beginner</text>
        
        <rect x="80" y="0" width="85" height="24" rx="12" fill="#2D111C"/>
        <text x="122" y="16" fill="#D48B97" font-size="10" font-family="sans-serif" text-anchor="middle">Portraits</text>
        
        <rect x="175" y="0" width="85" height="24" rx="12" fill="#2D111C"/>
        <text x="217" y="16" fill="#D48B97" font-size="10" font-family="sans-serif" text-anchor="middle">Landscapes</text>
      </g>
    </g>

    <!-- Main Workspace (Canvas + Tools) -->
    <g transform="translate(25, 90)">
      <!-- Left Drawing Canvas Area -->
      <rect width="420" height="300" rx="10" fill="#2D111C" stroke="rgba(212, 139, 151, 0.15)"/>
      <rect x="20" y="20" width="380" height="220" rx="8" fill="#FFFDF9"/>
      
      <!-- Step 3: Drawing Guide Overlay -->
      <line x1="210" y1="20" x2="210" y2="240" stroke="#F5ECE2" stroke-dasharray="4,4"/>
      <line x1="20" y1="130" x2="400" y2="130" stroke="#F5ECE2" stroke-dasharray="4,4"/>

      <!-- Vector Artwork in progress -->
      <circle cx="210" cy="115" r="45" fill="none" stroke="#D48B97" stroke-width="2" stroke-dasharray="3,3"/>
      <circle cx="210" cy="175" r="50" fill="none" stroke="#D48B97" stroke-width="2" stroke-dasharray="3,3"/>
      
      <path d="M 180 85 L 195 110 L 175 115 Z" fill="#8B263E"/>
      <path d="M 240 85 L 225 110 L 245 115 Z" fill="#8B263E"/>
      <path d="M 180 115 Q 210 80 240 115 Q 245 155 210 160 Q 175 155 180 115 Z" fill="#D48B97"/>
      <polygon points="195,125 225,125 210,140" fill="#4A0E17"/>
      <circle cx="198" cy="118" r="3.5" fill="#2D0D16"/>
      <circle cx="222" cy="118" r="3.5" fill="#2D0D16"/>

      <!-- Canvas Step indicator -->
      <rect x="20" y="255" width="140" height="28" rx="6" fill="#6B172E"/>
      <text x="90" y="273" fill="#FAF6F0" font-size="11" font-family="sans-serif" font-weight="bold" text-anchor="middle">Step 3 of 6: Shading</text>

      <!-- Step Navigation Buttons -->
      <rect x="300" y="255" width="45" height="28" rx="6" fill="#4A0E17"/>
      <text x="322" y="273" fill="#FAF6F0" font-size="11" font-family="sans-serif" text-anchor="middle">◀</text>

      <rect x="355" y="255" width="45" height="28" rx="6" fill="#D48B97"/>
      <text x="377" y="273" fill="#2D0D16" font-size="11" font-family="sans-serif" text-anchor="middle">▶</text>

      <!-- Right Sidebar: Interactive Steps & Toolkit -->
      <g transform="translate(435, 0)">
        <rect width="215" height="300" rx="10" fill="#240E16"/>
        <text x="15" y="28" fill="#FAF6F0" font-size="12" font-family="'Outfit', sans-serif" font-weight="bold">Lesson Breakdown</text>
        
        <!-- Step 1 Complete -->
        <g transform="translate(15, 42)">
          <rect width="185" height="42" rx="6" fill="#14050A"/>
          <circle cx="20" cy="21" r="9" fill="#D48B97"/>
          <text x="20" y="25" fill="#2D0D16" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">✓</text>
          <text x="40" y="24" fill="#F5ECE2" font-size="10" font-family="sans-serif">1. Basic Proportions</text>
        </g>

        <!-- Step 2 Complete -->
        <g transform="translate(15, 92)">
          <rect width="185" height="42" rx="6" fill="#14050A"/>
          <circle cx="20" cy="21" r="9" fill="#D48B97"/>
          <text x="20" y="25" fill="#2D0D16" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">✓</text>
          <text x="40" y="24" fill="#F5ECE2" font-size="10" font-family="sans-serif">2. Facial Contours</text>
        </g>

        <!-- Step 3 Active -->
        <g transform="translate(15, 142)">
          <rect width="185" height="42" rx="6" fill="#4A0E17" stroke="#D48B97" stroke-width="1.5"/>
          <circle cx="20" cy="21" r="9" fill="#D48B97"/>
          <text x="20" y="25" fill="#2D0D16" font-size="9" font-family="sans-serif" font-weight="bold" text-anchor="middle">3</text>
          <text x="40" y="24" fill="#FAF6F0" font-size="10" font-family="sans-serif" font-weight="bold">3. Shading &amp; Fur</text>
        </g>

        <!-- Step 4 Upcoming -->
        <g transform="translate(15, 192)">
          <rect width="185" height="42" rx="6" fill="#14050A" opacity="0.6"/>
          <circle cx="20" cy="21" r="9" fill="#3D1927"/>
          <text x="20" y="25" fill="#D6C5C9" font-size="9" font-family="sans-serif" text-anchor="middle">4</text>
          <text x="40" y="24" fill="#9E858B" font-size="10" font-family="sans-serif">4. Final Highlights</text>
        </g>

        <rect x="15" y="248" width="185" height="36" rx="6" fill="#6B172E"/>
        <text x="107" y="271" fill="#FAF6F0" font-size="10" font-family="sans-serif" font-weight="bold" text-anchor="middle">Download Practice Sheet 📥</text>
      </g>
    </g>
  </g>
</svg>
